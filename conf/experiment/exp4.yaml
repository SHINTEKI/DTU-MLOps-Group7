# @package experiment
name: exp4

model: resnet18

device: auto
accelerator: auto

batch_size: 2
max_epochs: 60
max_steps: -1
val_check_interval: 0.5
num_sanity: 0
precision: 16
decay: 0.0001
momentum: 0.9
lr: 0.1
lr_monitor: val_loss
lr_mode: min
lr_patience: 3
lr_decay: 0.5
lr_threshold: 0.00001

monitor: val_accuracy
monitor_mode: max
es_patience: 20

log_freq: 20
check_every_n_epoch: 1
 
criterion: NLLLoss
optimizer: SGD
scheduler: ReduceLROnPlateau
 